{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Company profile{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card p-4">
  <h1 class="h4 mb-3">Company profile</h1>
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="company">Company name</label><input class="form-control" id="company" name="company" value="{{ p.company }}" required maxlength="120"></div>
    <div class="row g-2 mb-3">
      <div class="col-sm-6"><label class="form-label" for="industry">Industry</label><input class="form-control" id="industry" name="industry" value="{{ p.industry }}"></div>
      <div class="col-sm-6"><label class="form-label" for="location">Location</label><input class="form-control" id="location" name="location" value="{{ p.location }}"></div>
    </div>
    <div class="mb-3"><label class="form-label" for="website">Website</label><input class="form-control" id="website" name="website" value="{{ p.website }}"></div>
    <div class="mb-3"><label class="form-label" for="description">About the company</label><textarea class="form-control" id="description" name="description" rows="4" maxlength="1000">{{ p.description }}</textarea></div>
    <button class="btn btn-primary">Save</button>
  </form>
</div></div></div>
{% endblock %}
