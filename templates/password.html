{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4"><div class="card p-4">
  <h1 class="h4 mb-3">Change password</h1>
  <form method="post">
    {{ csrf() }}
    <div class="mb-3"><label class="form-label" for="old">Current password</label><input class="form-control" id="old" name="old" type="password" required autocomplete="current-password"></div>
    <div class="mb-3"><label class="form-label" for="new">New password</label><input class="form-control" id="new" name="new" type="password" required minlength="8" autocomplete="new-password"></div>
    <button class="btn btn-primary">Update password</button>
  </form>
</div></div></div>
{% endblock %}
