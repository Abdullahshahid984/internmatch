{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-4">
  <div class="card p-4">
    <h1 class="h4 mb-3">Log in</h1>
    <form method="post" novalidate>
      {{ csrf() }}
      <div class="mb-3"><label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required autofocus autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary w-100">Log in</button>
    </form>
    <p class="small text-muted mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Sign up</a></p>
  </div>
</div></div>
{% endblock %}
