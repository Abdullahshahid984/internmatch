{% extends "base.html" %}
{% block title %}{{ e.code }}{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-4">{{ e.code }}</h1>
  <p class="lead">{{ {403: "You don't have access to this page.", 404: "We couldn't find that page."}.get(e.code, e.description) }}</p>
  <a class="btn btn-primary" href="{{ url_for('index') }}">Back to home</a>
</div>
{% endblock %}
